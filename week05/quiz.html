<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>

    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>Basic HTML and CSS Quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <!-- 'for' esta asiociado con el 'id' del imput -->
                <label for="q1">1.What does thte acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>
            <div class="quiz-item box">
                <label for="q2">2.How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q1">3.Which of the fallowing is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" seleced disable>Choose one</option>
                    <option value="">A. &lt;!-- this is a comment --&gt;</option>
                    <option value="">B. /* This is a comment */ </option>MatiasGabrielBae
                    <option value="">C. This is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4.What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px  15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <div>
                <button type="Submit">Submit Quiz for Grading</button>

            </div>
        </form>
    </main>
</body>

</html>
