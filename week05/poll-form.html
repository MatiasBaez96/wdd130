<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>

</head>

<body>
    <main>
        <form>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="email">Email</label>
            <input type="email" id="useremail" name="useremail" required>

            <!-- another valid way -->
            <!-- <label>Full Name: <input type="text" name="fullname" required></label>
            <label>Email: <input type="email" name="useremail" required></label> -->

            <label for="browser">What is your favourite internet browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">chrome</option>
                <option value="firefox">firefox</option>
                <option value="edge">edge</option>
                <option value="brave">brave</option>
                <option value="other">other</option>
            </select>
            <label for="pet">List the places you have lived.</label>
            <select name="pet" id="pet">

                <option value="pet"></option>
                <option value="checkbox"></option>
                <option value="feedback"></option>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            </select>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
</body>
<footer>

</footer>

</html>
