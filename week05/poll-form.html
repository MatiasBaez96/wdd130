<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <main class="form-container">

        <form>
            <h1>WDD | HTML Form - User Poll</h1>

            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <div class="form-item column1">
                    <label for="browser">
                        What is your favourite internet browser?
                    </label>

                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-item column1">
                    <label for="pet">Do you have a pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item column1">
                    <label for="places">
                        List the places you have lived:
                    </label>

                    <textarea name="places" id="places" rows="4"
                      placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </div>

                <button type="submit">Submit Poll</button>

            </fieldset>
        </form>

    </main>

    <footer>
        <p>© 2026 WDD 130 - HTML Form</p>
    </footer>

</body>

</html>
