<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Baez">
    <meta name="description"
      content="Contact Exciting Expeditions to plan your next white water rafting adventure.">
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting Company</title>
</head>

<body class="contact">

    <!-- header -->
    <header>
        <img src="images/logo.jpg" alt="Exciting Expeditions logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="current">Contact Us</a>
        </nav>
    </header>

    <!-- main -->
    <main>

        <!-- contact info -->
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <h2>123 Main River Street</h2>
            <h2>Kolob, Utah</h2>
            <h2><a href="tel:+19999999999">+1 999 999 9999</a></h2>
            <h2><a href="mailto:info@whitewater.com">info@whitewater.com</a></h2>
        </div>

        <!-- map and form -->
        <div class="contact-layout">
            <iframe
              src="https://www.google.com/maps?q=Kolob+Canyons+Visitor+Center,+Utah&output=embed"
              title="Map showing the location of Exciting Expeditions" allowfullscreen></iframe>

            <form>
                <fieldset>

                    <div class="data">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="data">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>

                    <div class="message-purpose">
                        <span class="field-title">Message Purpose:</span>

                        <div class="options">
                            <label>
                                <input type="radio" id="general" name="Purpose" value="general">
                                General Inquiry
                            </label>
                            <label>
                                <input type="radio" id="reservation" name="Purpose"
                                  value="reservation">
                                Reservation
                            </label>
                            <label>
                                <input type="radio" id="other" name="Purpose" value="other">
                                Other
                            </label>
                        </div>
                    </div>

                    <div class="Message">
                        <label for="places">Message:</label>
                        <textarea name="places" id="places" rows="4"
                          placeholder="Write your message here..."></textarea>
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch</button>

                </fieldset>
            </form>
        </div>

        <!-- employees -->
        <section class="section-block">
            <h2>We Are Here to Serve You!</h2>

            <div class="team">
                <figure class="card">
                    <img src="images/employeer_01.jpg" alt="Portrait of Lucas Moreno">
                    <figcaption>
                        <h3>Lucas Moreno</h3>
                        <span class="role">Lead River Guide</span>
                        <p>Over 10 years guiding rafters through Class IV rapids.</p>
                    </figcaption>
                </figure>

                <figure class="card">
                    <img src="images/employeer_02.jpg" alt="Portrait of Ana Torres">
                    <figcaption>
                        <h3>Ana Torres</h3>
                        <span class="role">Safety Instructor</span>
                        <p>Certified in swift water rescue and first aid.</p>
                    </figcaption>
                </figure>

                <figure class="card">
                    <img src="images/employeer_03.jpg" alt="Portrait of David Ruiz">
                    <figcaption>
                        <h3>David Ruiz</h3>
                        <span class="role">Trip Coordinator</span>
                        <p>Helps you pick the perfect trip for your group.</p>
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <!-- footer -->
    <footer>
        <p>© 2026 💧 Exciting Expeditions 💧 Franco Corbella</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/social.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/icons8-instagram-96.png" alt="Instagram">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>

</html>
