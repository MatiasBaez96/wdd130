<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Baez">
    <meta name="description"
      content="Experience exciting rafting adventures with our professional rafting company.">
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home | White Water Rafting Company</title>
</head>

<body class="home">

    <!-- header -->
    <header>
        <img src="images/logo.jpg" alt="Exciting Expeditions logo">

        <nav>
            <a href="index.html" class="current">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- main -->
    <main>

        <!-- hero -->
        <div class="hero">
            <img src="images/rafting3.jpg" alt="Rafters paddling through white water rapids">
            <h1>Brave the Rapids! Live the Adventure</h1>
        </div>

        <!-- see trips -->
        <aside class="trips-cta">
            <h2>Ready for the River?</h2>
            <p>Find the perfect trip for you and your group.</p>
            <a href="trips.html" class="btn">See Trips</a>
        </aside>

        <!-- two images -->
        <div class="images">
            <img src="images/rafting22.jpg" alt="Raft running through a canyon">
            <img src="images/rafting42.jpg" alt="Group enjoying a half day rafting trip">
        </div>

        <!-- newsletter -->
        <form class="newsletter">
            <fieldset>
                <h2>Join Our Newsletter</h2>

                <div class="data">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="data">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <button type="submit">Subscribe</button>
            </fieldset>
        </form>

    </main>

    <!-- footer -->
    <footer>
        <p>© 2026 💧 Exciting Expeditions 💧 Franco Corbella</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/social.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/icons8-instagram-96.png" alt="Instagram">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>

</html>
